[workspace]
resolver = "3"
members = ["crates/calcarc-core", "crates/calcarc-wasm"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/terapyon/CalcArc"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
