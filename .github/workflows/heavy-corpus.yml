name: Heavy corpus

# **たまにしか走らせない検証である**(設計書 2026-08-15 §12 の段階 5)。
# 毎コミットの CI は golden(手選びの数十件)を見ており、こちらは
# 数万件の生成コーパスを独立実装と突き合わせる。
#
# 走らせるのは:
#  - 手動(workflow_dispatch)——確かめたくなったとき
#  - リリース(release.yml)から呼ばれたとき——**本番へ出す条件**である
#
# **週 1 の cron は外した**(ユーザ裁定 2026-08-25)。
# **`push: tags` も外した**(ユーザ裁定 2026-08-25)——タグからは `release.yml` が
# 呼ぶので、両方を残すと同じタグで重量級が 2 回走る(設計書 §3.1)。
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  # 接頭辞 `heavy-` を外さない(理由は ci.yml と同じ。設計書 §3.2)。
  group: heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # **45 分を使う前に、1 分で分かることを先に見る。** 版数がタグと食い違って
  # いるなら、そのリリースはもう間違っているので、計算を測る意味がない。
  version:
    name: Version numbers agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # node の版はこの複合アクションが一本で持っている。**写しで持つと
      # 片方だけ更新される**ので、依存を入れる分だけ遅くてもこちらに乗せる。
      - uses: ./.github/actions/setup-web

      - name: The five places must agree, and match the tag
        # **タグから走ったときだけタグと照合する。** workflow_dispatch は
        # ブランチから走るので `github.ref_name` がタグ名ではない——渡すと
        # 「ブランチ名と版数が違う」という無意味な赤になる。
        #
        # `pnpm` 越しではなく node を直に呼ぶのは、引数の受け渡しを
        # pnpm の版の挙動に預けないためである。
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            node tools/check-version.mjs --tag "$REF_NAME"
          else
            node tools/check-version.mjs
          fi

  corpus:
    name: Corpus vs reference
    runs-on: ubuntu-latest
    # **版数が食い違っていたら走らせない。** 手で回したいときに版数が
    # 揃っていないなら、まず揃える——毎回の CI が同じ検査を回しているので、
    # ここで止まるのは「main に入っていない何かを手で回した」ときだけである。
    needs: version
    # 生成コーパスは 1 万件超あり、既定の 6 分では足りない。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-web

      # Rust(wasm32) + rust-cache + wasm-pack。**版の固定はこの複合アクションに
      # 一本化されている**——写しで持つと片方だけ更新される、とあちらの説明が
      # 自ら書いている。`pnpm heavy` が中で wasm を作り直すので、これが要る。
      - uses: ./.github/actions/setup-wasm-pack

      # **heavy は自分のパッケージなので、自分で依存を入れる。** pnpm と node は
      # 上の setup-web が用意済みで、版の固定はあちらに一本化されている。
      - name: Install the heavy package
        # 種別: 前提を整える
        run: pnpm install --frozen-lockfile
        working-directory: heavy

      # **型検査より先に wasm を作る。** `heavy/` の型検査は `web/src/calc` を
      # 通って `web/src/wasm/` の型宣言に届く。**新しいクローンにはそれが
      # 無い**ので、ここを飛ばすと `TS2307` で落ちる——手元のワークツリーには
      # 既にあるため、手元では緑のまま気づけない(v0.4.1 の走行で実際に踏んだ。
      # CLAUDE.md の「新しいクローンでは先に `pnpm wasm`」と同じ罠である)。
      - name: Build the wasm the type checker needs
        # 種別: 前提を整える
        id: wasm
        run: pnpm --dir ../web wasm
        working-directory: heavy

      # **11 分の変異を回す前に、数十秒で落ちるものを先に落とす。**
      # 重量級のユニット 6 本は「測る道具そのもの」を見張っており、
      # 普段の CI では走らない(2026-08-25 のユーザ裁定)。ここが唯一の場所である。
      - name: The measuring instrument must be sound
        # 種別: 判定する
        run: pnpm typecheck && pnpm lint && pnpm test
        working-directory: heavy

      # **`if: always()` が要る。** 下の走行 3 本が `always()` を持つ以上、
      # ブラウザの導入だけが飛ばされると、道具の不調が
      # 「`browserType.launch: Executable doesn't exist`」に化けて 36 本が
      # 全滅する——v0.4.1 の走行で実際にそうなり、本当の原因(型検査の赤)が
      # 埋もれた。段ごとの失敗を独立させる。
      - name: Install Playwright's browser
        # 種別: 前提を整える
        id: browser
        if: always()
        run: pnpm exec playwright install --with-deps chromium
        working-directory: heavy

      - name: Set up Python for the reference implementation
        # 種別: 前提を整える
        #
        # **`always()` が要る。** 土台の検査(下)は TypeScript の道具立てと
        # 何の関係も無い。ここを飛ばすと、**道具の赤が土台の未検査に化ける**
        # ——v0.4.1 の走行では実際にそうなり、期待値が生成器の出力かどうかを
        # 一度も見ないまま走行が終わった。
        if: always()
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install the reference implementation
        # 種別: 前提を整える
        id: deps
        if: always()
        run: uv sync --locked
        working-directory: reference

      - name: The committed corpus must equal a fresh generation
        # 種別: 判定する
        #
        # **これが固定コーパスの土台である。** コミットされた JSON が
        # 生成器の出力と 1 バイトでも違えば、期待値が手で触られたことになる。
        #
        # **ここが赤いとジョブが赤くなり、本番へは出ない**——落ちた段が 1 つでも
        # あればジョブは失敗で、`release.yml` の `Deploy` は走らない(v0.4.1 の
        # 走行 32857987219 で実測: 道具の段が赤く、`Deploy` は skipped)。
        # **門はジョブの側に在る。** この段が下の照合を止めないのはそのためで、
        # 止める代わりに**報告書が「土台が赤かった」と書く**
        # (`heavy/reproducibility.json` → `renderReproducibility`)。
        #
        # 自分の前提だけを名指しする。**道具の赤に巻き込まれない。**
        id: repro
        if: always() && steps.deps.outcome == 'success'
        run: uv run pytest tests/test_corpus_reproducibility.py -q
        working-directory: reference

      - name: Measure what this corpus can detect
        # 種別: 測る
        # **「不一致 0 件」の意味を決める段である。** engine に既知の壊れ方を
        # 一時的に入れ、何件が赤くなるかを数える。**赤くならないことを期待した
        # 変異も含む**——レポートが「この領域は踏んでいない」と書いているなら、
        # その主張はここで確かめられている。
        #
        # 変異はコミットされない(測ったあと原文に戻し、バイト一致を確かめる)。
        # この段の結果が次の段のレポートに載る。
        #
        # **土台を名指しで前提にする。** この段が出すのは「この網はこれだけの
        # 壊れ方を捕まえる」という**数**であり、報告書に主張として載る。
        # **期待値が生成器の出力でないなら、その数は誰も信じない**ので、
        # 11 分を費やさない。**以前も同じ挙動だったが、それは段の並びが
        # 偶然そうなっていただけで、条件としては書かれていなかった。**
        # 飛ばされたことは報告書が言う(「回し忘れではない」の枝)。
        if: >-
          always() && steps.wasm.outcome == 'success' && steps.browser.outcome
          == 'success' && steps.repro.outcome == 'success'
        run: pnpm heavy:power
        working-directory: heavy
        env:
          CI: "1"

      - name: Type a sample on the real keypad
        # 種別: 判定する
        # **計算コアの経路とはブラウザに載るものが違う。** あちらは
        # `heavy-harness.html` だけを配信するので画面が存在せず、
        # 「そのキーが盤面のどこにあるか」を一度も通らない。ここは
        # 本物のアプリを開いて実際にボタンを押す。
        #
        # **前の段が落ちても走らせる**——計算が合っているかと、盤面から
        # 打てるかは別の問いで、片方の赤でもう片方を隠さない。
        #
        # **レポートを書く段より前に置く。** 報告書は `pnpm heavy` の走行末尾で
        # 書かれ、**その時点でディスクにある `heavy/heavy-ui-run.json` を読む**。
        # まっさらな runner にはその記録が無いので、あとに置くと盤面の行が
        # **毎回「記録が無い」になり**、`uiHealth` の 4 状態のうち 1 つしか
        # CI に出ない。順番だけがそれを決めている。
        #
        # **前提だけを名指しする。土台は前提ではない。** 盤面から打てるかは、
        # 期待値が生成器の出力かどうかと何の関係も無い。**逆に、wasm と
        # ブラウザは前提である**——無いまま走らせると、道具の不調が
        # 「`Executable doesn't exist`」に化けて 36 本が全滅する(v0.4.1)。
        # **`always()` だけでは、その化け方を止められなかった。**
        if: >-
          always() && steps.wasm.outcome == 'success' && steps.browser.outcome
          == 'success'
        run: pnpm heavy:ui
        working-directory: heavy
        env:
          CI: "1"

      - name: Run the heavy corpus
        # 種別: 判定する
        # CI=1 で wasm を作り直し、プレビューも立て直す
        # (前の走行のサーバを掴んだまま「緑」にしない)。
        #
        # **こちらにも `if: always()` が要る。** 上の段を前に出した以上、
        # これが無いと `heavy:ui` の赤が `heavy` を丸ごと隠す——「片方の赤で
        # もう片方を隠さない」を、入れ替えた向きにも掛ける。
        # `heavy:power` が落ちて `detection-power.json` が無いときは、報告書が
        # 「測っていない」と書く(`renderDetectionPower` の `null` の枝)ので、
        # 測っていない走行が測った顔で出ることはない。
        #
        # **土台が赤くても走らせる。** 止めるのはジョブの側で既に効いており
        # (`Deploy` は skipped)、ここで止めると**どのファイルが食い違ったのか
        # という診断が失われる。** 報告書は土台が赤いことを先頭近くで書き、
        # 「下に並ぶ『不一致 0 件』を結果として読まないこと」と付ける。
        # **前提(wasm・ブラウザ)だけを名指しする。**
        if: >-
          always() && steps.wasm.outcome == 'success' && steps.browser.outcome
          == 'success'
        run: pnpm heavy
        working-directory: heavy
        env:
          CI: "1"

      - name: Put the verdict in the job summary
        # 種別: 集める
        #
        # **記録はここに残る。** コミットされたログファイルは作らない
        # ——走らせた事実と結果が GitHub 上で読めれば足りる(ユーザ裁定 2026-08-17)。
        if: always()
        run: |
          if [ -f heavy/heavy-report.md ]; then
            cat heavy/heavy-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 報告書が書かれなかった" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "集計が 1 つも揃わないまま走行が終わった。**結果を読まないこと。**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report as an artifact
        # 種別: 集める
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heavy-report
          path: heavy/heavy-report.md
          # **`warn` にしない。** 報告書が書かれなかったことを警告で流すと、
          # リリースの証拠が「重量級は走った」と言いながら報告書を持たない、
          # という形で通ってしまう(2026-08-26、B-2)。走ったなら報告書は在る。
          if-no-files-found: error
          retention-days: 90
