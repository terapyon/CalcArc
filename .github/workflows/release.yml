name: Release

# **`v*` タグが本番への唯一の扉である**(ユーザ裁定 2026-08-25、
# `docs/superpowers/specs/2026-08-25-release-gate-design.md`)。
#
#   タグ → 版数ゲート → CI 全部 → 重量級コーパス → 本番展開 ─┬→ マニュアル ─┐
#                                                             └─────────────┴→ 証拠と Release
#
# **マニュアル(PDF)は本番展開のあとで作り、落ちても本番を止めない**
# (2026-09-10 の裁定。下の `manuals` ジョブ)。落ちたことは証拠が書く。
#
# **検査の定義をここに写さない。** `ci.yml` と `heavy-corpus.yml` と `deploy.yml` を
# `workflow_call` で**呼ぶ**だけにする——写しを持つと、片方だけ直された日に
# 「リリース前に通した検査」と「毎回の CI」が別物になる(設計書 §3)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # 接頭辞 `release-` を外さない。呼ばれる側の群と重ならないようにするため
  # (設計書 §3.2)。リリースは途中中断より直列完走。
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # **45 分を使う前に、1 分で分かることを先に見る。** 版数がタグと食い違って
  # いるなら、そのリリースはもう間違っている。
  #
  # `heavy-corpus.yml` も自分の入口で同じ検査を持つ(手動で回すときのため)。
  # **判定の実体は `tools/check-version.mjs` の 1 つだけ**で、両方とも
  # それを呼ぶ——写しているのは呼び出しであって、規則ではない。
  version:
    name: Version numbers agree with the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard — Release runs only from a v* tag
        # **タグ以外から回すと、45 分走ってから `deploy` のガードで落ちる。**
        # その赤は「検査が落ちた」のか「そもそも回し方が違う」のか区別できない
        # ——最初の 5 秒で、意味の定まった赤にする(B-9)。
        # 手元の確認で回したいなら `Deploy` か `Heavy corpus` を直接起動する。
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Release は v* タグからのみ。個別に確かめるなら Deploy / Heavy corpus を直接起動する" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # **タグが main の子孫かを見るのに全履歴が要る**(B-8)。
          fetch-depth: 0
      - uses: ./.github/actions/setup-web
      - name: The tag must sit on main
        # **誰も見ていなかった**——main に入っていないコミットにタグを打てば、
        # そのまま本番へ出る。版数が揃っていても、それは main の内容ではない。
        run: |
          set -eu
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "このタグは main の履歴に入っていない(main へマージしてからタグを打つ)" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"
      - name: The six places must agree, and match the tag
        # タグから走ったときだけタグ名と照合する。`workflow_dispatch` は
        # ブランチからも走せるので、渡すと無意味な赤になる。
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            node tools/check-version.mjs --tag "$REF_NAME"
          else
            node tools/check-version.mjs
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  heavy:
    name: Heavy corpus
    needs: ci
    # **重量級を本番の条件にする**(ユーザ裁定 2026-08-25)。実測 35〜41 分。
    # これは「Heavy をリリース前の必須ゲートにはしない」という 2026-08-25 の
    # テスト空間モデル設計書 §3 の非目的を**撤回した**もので、あちらにも
    # 撤回を書いてある。
    uses: ./.github/workflows/heavy-corpus.yml

  deploy:
    name: Deploy
    needs: heavy
    uses: ./.github/workflows/deploy.yml
    with:
      # **検査を通してここへ来たことを伝える。** 伝えないと、`release.yml` を
      # 手動起動したときに「検査を迂回して配った」と偽の記録が残る(B-9)。
      called_from_release: true
    # Cloudflare の資格情報は呼ばれた側で要る。**呼ばれた側は
    # 呼び出し元の secrets を自動では受け取らない。**
    secrets: inherit

  # **マニュアルの PDF は本番展開のあとで作る**(1.0 の門 4、マニュアルの設計書
  # `docs/superpowers/specs/2026-09-10-manuals-design.md` §5、裁定 §9 #3
  # 「本番は止めない」)。
  #
  #   … → Deploy ─┬→ Manuals ─┐
  #               └───────────┴→ Evidence and GitHub Release
  #
  # **落ちても本番は既に出ている。** 代わりに `Evidence` が「マニュアル(PDF)は
  # 作れなかった」と証拠に書く——`tools/release-evidence.mjs` の `MANUALS_JOB`。
  # **証拠が落ちたジョブを許すのは、この 1 つだけである**(`MAY_FAIL`)。
  #
  # **手順は `ci.yml` の `Manuals` と同じ `pnpm manuals` の 1 行**で、違うのは
  # PDF を artifact に上げる 1 段と `permissions` だけである(段の一致は
  # `tools/tests/release-workflow.test.ts` が見る)。検査ではなく**作る**ジョブ
  # なので上の「写さない」には当たらないが、**写すと片方だけ直る**のは同じなので、
  # 手順は `web/package.json` の 1 か所に置いた。
  #
  # **wasm は、この走行の `CI` が作ったもの(`wasm-pkg`)を取る。** 呼ばれた
  # ワークフローが上げた artifact は呼び出し元の走行に属する——`Evidence` が
  # `heavy-report` と `deployed-dist` を同じ形で取っている(v0.4.1 の走行
  # 32908847850 で 3 点が付いた)。画面は撮影の設定が E2E の `webServer`
  # (`vite build` → `preview`)で組み立てる。**配った `dist` からは撮らない**
  # ——同じタグのコミットを同じ手順でビルドするので中身は同じはずだが、
  # **バイト一致は確かめていない**(見立て)。
  #
  # **時間制限: 25 分。** `ci.yml` の規則(観測の最大の 2 倍・5 分刻み・下限 10 分)を
  # このジョブに当てる実績は、まだ 1 本も無い(足した時点、2026-09-11)。手元の
  # 実測は `pnpm manuals` の 2 段で 11.0 秒(撮影 9.0 秒と PDF 1.9 秒。作業機、
  # 2026-09-11)だが、**手元の秒数は runner の実績ではない。**
  # **重い段は `ci.yml` の `End-to-end` と同じ**(Chromium を `--with-deps` で入れ、
  # `vite build` → `preview` を立てる)で、あちらの実績の最大は 612 秒の外れ値
  # ——**それがどの段で延びたかは追っていない**ので、同じ段を持つこのジョブが
  # 同じ日に 10 分(下限)を超えないとは言えない。だから `End-to-end` の実績から
  # 出た 25 分を借りた(`ci.yml` の表の `Manuals` の行も同じ値を同じ理由で借りて
  # いる。**値を写したのではなく、同じ実績に同じ規則を当てた**)。
  # **ここで殺しても本番は変わらない**——失うのは PDF だけで、証拠はそれを書く。
  # 緩い側の代償は、固まった日に `Evidence` がこの分だけ遅れて付くことである。
  # 実績が溜まったら、このジョブの走行から決め直す。
  manuals:
    name: Manuals
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # 読むのはリポジトリだけ。**同じ走行の artifact の取得と上げに、トークンの
      # 権限は要らない**(`download-artifact` の README——`github-token` は
      # 別の走行・別のリポジトリから取るときだけ要る。この権限のまま取れるかは
      # 実走で確かめていない。取れなければこのジョブが赤くなり、証拠がそれを書く)。
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm manuals
      - name: Keep the manuals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manuals
          path: web/manual-dist/*.pdf
          # **`warn` にしない。** `pnpm manuals` が緑なのに PDF が無いなら、
          # それは「作れた」ではない(`heavy-corpus.yml` の報告書と同じ、B-2)。
          if-no-files-found: error
          retention-days: 90

  evidence:
    name: Evidence and GitHub Release
    # **`Manuals` を待つが、`Manuals` の結論には縛られない**(マニュアルの設計書 §5)。
    #
    # - **待つ理由**: 証拠を書くには `Manuals` の結論が要る。`Manuals` を証拠の
    #   後ろに置くと、証拠は結論を知らずに書かれる
    # - **縛られない理由**: 既定の条件(`success()`)のままだと、`Manuals` が
    #   落ちた日にこのジョブは**飛ばされる**——**本番へは出たのに、証拠 3 点が
    #   1 つも付かない。** 設計書が「採らない」とした (ウ) と同じ結末である
    # - **`always()` にしない**(`release-workflow.test.ts` の「always() の意味を
    #   分ける」と同じ規律)。`always()` は**手で止めた走行でも走る**——止めた人は
    #   理由を知っているので、証拠を書き足す意味が無い。`!cancelled()` は失敗の
    #   あとには走り、止められた走行では走らない
    # - **前提を名指す**: `Deploy` が成功したときだけ。名指さないと、重量級が
    #   落ちて本番へ出なかった走行でも `!cancelled()` が真になり、このジョブが
    #   走って「緑でない走行から証拠は作れない」で赤くなる——**本番へ出ていない
    #   走行に、証拠のジョブの赤が 1 つ増える。**
    needs: [deploy, manuals]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Release の作成と添付に要る。**この 1 ジョブだけが書き込みを持つ。**
      contents: write
      # 走行のジョブ一覧を `gh api` で読むのに要る。public では既定で読めるが、
      # **private 化した日に黙って証拠が書けなくなる**のを防ぐ(B-5)。
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 重量級の報告書と、実際に配った物。**どちらもこの走行が作ったもの**で、
      # 別の走行から拾ってこない(別の走行の結果を添えたら、証拠にならない)。
      # **`continue-on-error` を付けない。** このジョブは `deploy` を経て
      # `heavy` の後ろに居るので、**重量級は必ず走っている**。報告書が取れない
      # なら、それは「無くてもよい」ではなく**証拠が揃わない**ということである
      # (2026-08-26、B-2)。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: heavy-report
          path: evidence/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployed-dist
          path: dist/
      # **マニュアルの PDF は、`Manuals` が成功したときだけ取る。** 落ちた日に
      # 取りに行くと、この段が「artifact が無い」で落ち、**証拠ごと付かなくなる**
      # ——`Manuals` を本番のあとへ置いた意味が裏返る。**`continue-on-error` で
      # 流さない**——流すと「PDF が無い」の理由が「作れなかった」と「取れなかった」
      # の 2 つになり、証拠がどちらかを言えない。成功したのに取れないなら、
      # 上の 2 つと同じく**証拠が揃わない**ので落ちてよい。
      # 取った PDF は `evidence/` に入り、下の `ls evidence` で添付と証拠の両方に載る。
      - name: Fetch the manuals
        if: ${{ needs.manuals.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manuals
          path: evidence/

      - name: Pack what was deployed
        # `mkdir -p` は残す。取得の順序を入れ替えたときに `evidence/` が
        # 無い状態で来ても、ここが原因で落ちないようにするため。
        run: |
          set -eu
          mkdir -p evidence
          tar -czf "evidence/calcarc-${GITHUB_REF_NAME}-dist.tar.gz" -C dist .

      - name: Write the evidence
        # **結論は走行そのものから読む。** ステップの出力を人が(あるいは私が)
        # 書き写すと、「緑だったと書いてあるが実は落ちていた」が作れてしまう。
        # 組み立ての中身は `heavy/tests/unit/release-evidence.test.ts` が固定して
        # いる——落ちた検査が 1 つでもあれば、このスクリプトは証拠を書かずに
        # 落ちる。**例外は `Manuals` の 1 つだけ**で、落ちていれば「マニュアル(PDF)は
        # 作れなかった」と書いて続ける(`MAY_FAIL`。1 つであることを
        # `tools/tests/release-workflow.test.ts` が固定する)。
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # **自分の名前を渡す。** 渡さないと「この証拠を書いているジョブ自身
          # である」と名乗れない——名乗れないことと、嘘を書くことは別である。
          # この名前が下の `name:` と一致することは
          # `heavy/tests/unit/release-workflow.test.ts` が固定する(B-3)。
          SELF_JOB_NAME: Evidence and GitHub Release
        run: |
          set -eu
          attachments="$(ls evidence)"
          # shellcheck disable=SC2086
          node tools/release-evidence.mjs $attachments > evidence/release-evidence.md

      - name: Put the evidence in the job summary
        run: cat evidence/release-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release and attach the evidence
        # **本文にも証拠を載せる。** 添付とジョブのサマリーだけに置くと、
        # **読む人が最初に見る場所**に結論が出ない。
        #
        # 「Release が既に在る」は例外ではなく**通常経路**である——GitHub の UI で
        # Release を作る操作がタグを push し、この走行を起こす。v0.4.1 では
        # Release の公開が走行開始の 2 秒前で、`create` 側は一度も走らなかった。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # **経路を 1 本にする**(F-3)。分岐は「Release を作るか、既に在るか」
          # だけにして、**添付と本文の順序は両方で同じ**にする——`create` に
          # 本文と資産を一緒に渡していた頃は、B-1 で塞いだ壊れ方（存在しない
          # 添付を語る本文）が `create` 側にだけ残っていた。
          #
          # **`gh` が `create` の中で本文と資産をどの順で扱うかは測っていない。**
          # 測れないなら**依存しない形にする**のが確実である。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes ""
          fi
          gh release view "$TAG" --json body --jq .body > existing-notes.md
          # **自動生成の "What's Changed" は消さない。** 前に残して証拠を継ぎ足す。
          # 貼り直しの規則(二重に積まない・同じ入力なら同じ本文・1 バイトも
          # 伸びない)は `tools/release-notes.mjs` の純関数が持ち、
          # **`heavy/tests/unit/release-notes.test.ts` が v0.4.1 の実物の本文で
          # 固定している**——ここをシェルで書いていた頃、それを見張るテストは
          # 0 本だった。
          node tools/release-notes.mjs existing-notes.md evidence/release-evidence.md > notes.md
          # **添付を先に、本文を後に。** 逆にすると、添付の途中で落ちたときに
          # **存在しない添付を語る本文**が残る——証拠が嘘をつく側の壊れ方で
          # ある。添付が済んでから、それを語る本文を書く。
          gh release upload "$TAG" evidence/* --clobber
          gh release edit "$TAG" --notes-file notes.md
