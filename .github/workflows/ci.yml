name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # リリース(release.yml)から呼ばれる。**ジョブの中身は 1 行も変えない**
  # ——「リリース前に通した検査」と「毎回の CI」が別物にならないよう、
  # 定義はこの 1 ファイルだけに置き、呼ぶ側は呼ぶだけにする(設計書 §3)。
  workflow_call:

concurrency:
  # **接頭辞 `ci-` を外さない。** 呼ばれた側の `github.workflow` には
  # **呼び出し元の名前**が入るので、接頭辞が無いと群が呼び出し元と重なり、
  # `cancel-in-progress: true` が**呼び出し元の走行を打ち切る**(設計書 §3.2)。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# **どのジョブにも時間制限を置く。** 書かないと GitHub の既定は
# **6 時間(360 分)**で、固まったジョブがそこまで走る(2026-09-05 に一次資料で
# 確認—— docs.github.com/en/actions/reference/limits の「Each job in a workflow
# can run for up to 6 hours of execution time.」。**`heavy-corpus.yml` には
# 「既定の 6 分」と書かれていた**——時間/分 の取り違えで、あちらの 45 分は
# その前提で選ばれていた。同じコミットで直してある)。2026-09-05 の `v0.8.0` の Release 走行で
# `Rust core` が **45m0s** で死んだ(`The hosted runner lost communication with
# the server.`、走行 33942305098 の 1 回目)——**普段 1 分のジョブ**である。
# あのときは GitHub 側が見切ったが、**それは私たちが決めた値ではない。**
#
# **ただし、この 1 例が時間制限で短く終わったかどうかは(未確認)である。**
# 45m0s の死因は `runner lost communication` であり、**runner が居なくなった
# 走行に `timeout-minutes` がどう効くかは一次資料で確かめられない**
# ——docs は「GitHub が cancel する」としか言わない(2026-09-09 のレビュー指摘)。
# **動機の例としては残すが、「置いていればもっと早く切れた」とは、この例からは
# 言えない。** 時間制限の主眼は**固まった走行を私たちの決めた時刻で切ること**で、
# そちらはこの未確認に左右されない。
#
# **値の決め方: 観測された最大の 2 倍を下回らない値を、5 分刻みで切り上げる。
# ただし下限は 10 分。** 実績は成功した 25 走行 150 ジョブから取った
# (2026-09-05、`gh api .../runs/<id>/jobs` の `started_at`〜`completed_at`):
#
#     Rust core                最大  93 秒 (平均 62)  → 10 分
#     WASM boundary            最大  96 秒 (平均 51)  → 10 分
#     Web build and unit tests 最大  64 秒 (平均 52)  → 10 分
#     Heavy tooling            最大  32 秒 (平均 23)  → 10 分
#     Python reference         最大 102 秒 (平均 97)  → 10 分
#     End-to-end               最大 612 秒 (平均 120) → 25 分
#     End-to-end (WebKit)      実績なし               → 25 分(借りた値。下を見よ)
#     Manuals                  実績なし               → 25 分(借りた値。下を見よ)
#
# **2 倍にしたのは、いちばん遅い実績が 1 回きりの外れ値だから**である
# ——End-to-end は 25 本中 1 本だけ 612 秒で、**次に遅いものは 113 秒**
# (走行 33609781012)。**外れ値の 2 倍**なら、同じことがもう一度起きても
# 健全な走行は落ちない。**1 走行ぶんの数字で決めると、ここを踏む。**
#
# **下限 10 分は、速いジョブに実測どおりの値を与えないため**である。
# `Heavy tooling` は最大 32 秒だが、2 倍の 64 秒にすると runner が遅い日に
# 落ちる。**これは性能の予算ではなく、固まったことの検出器**である
# ——**緩すぎれば意味が無いが、きつすぎれば健全な走行を殺す**ので、
# 迷ったら緩い側へ倒してある(それでも既定より 1 桁以上小さい)。
#
# **`End-to-end (WebKit)` だけは実績から決めていない。** 足した時点(2026-09-10)で
# WebKit の走行は 1 本も無く、**上の規則(観測の最大の 2 倍)を当てる数が無い。**
# だから**いちばん近いジョブ(`End-to-end`)の 25 分を借りた**(設計書
# `docs/superpowers/specs/2026-09-10-one-point-oh-gate-design.md` §1.3)。
# **実績が溜まったら、この規則で決め直す。** そのとき表のこの行に
# 「最初の値は `End-to-end` から借りた」と残す——**借りた値と実績から出した値を、
# 次に見直す人が取り違えないため**である。
#
# **`Manuals` も実績から決めていない。** 足した時点(2026-09-11)で走行は 1 本も
# 無い。手元の実測は `pnpm manuals` の 2 段で 11.0 秒(撮影 9.0 秒——`vite build`
# と `preview` の起動を含む——と PDF 3 冊 1.9 秒。作業機、2026-09-11。依存の導入と
# Chromium の導入は含まない)だが、**手元の秒数は runner の実績ではない**ので、
# 上の規則には当てない(当てれば下限の 10 分になる)。
# **10 分にしなかったのは、重い段が `End-to-end` と同じだから**である——Chromium を
# `--with-deps` で入れ、`vite build` → `preview` を立てる(撮影の設定は E2E の
# `webServer` をそのまま使う)。`End-to-end` の 612 秒の外れ値が**どの段で延びたかは
# 追っていない**ので、同じ段を持つこのジョブが同じ日に 10 分を超えないとは言えない。
# だから WebKit と同じく **`End-to-end` の 25 分を借りた。** 実績が溜まったら
# この規則で決め直し、この行に「最初の値は `End-to-end` から借りた」と残す。
#
# **他のワークフローの値をここへ写さない。逆も同じ。** 同じ規則を当てても、
# 実績が違えば値は違う——`heavy-corpus.yml` の corpus は 41 分走るので 85 分、
# `deploy.yml` は最大 87 秒だが**内側に 6 分の再試行予算がある**ので 20 分。
# **どちらも規則の当て方をそのファイルに書いてある**(値だけ写すと、次に
# 見直す人が根拠のない数字を受け取る)。
#
# 番人は `tools/tests/release-workflow.test.ts` の
# 「すべてのジョブに時間制限が在る」。**4 つのワークフロー全部**を見ており、
# **免除は 0 件**である。
jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable ブランチ 2026-08-13 時点
        with:
          # SHA 固定により ref からのツールチェーン選択が効かないため明示する。
          # stable 追従の方針は CONTRIBUTING の MSRV 節のとおり。
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Layer 1-4: unit / engine table / proptest / golden
      - run: cargo test --workspace

  wasm:
    name: WASM boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm-pack
      - name: Use the runner's ChromeDriver
        # wasm-pack は既定で自前の ChromeDriver を取りに行くが、それが
        # ランナーの Chrome とバージョン不一致になると起動に失敗する。
        # Task 14 の実装中に実際にこれが起きた（Chrome 135 に対して
        # ChromeDriver 151 が降ってきた）。ランナー同梱の対になっている
        # ものを使わせる。
        run: echo "CHROMEDRIVER=$(which chromedriver)" >> "$GITHUB_ENV"
      - run: wasm-pack build crates/calcarc-wasm --target web --out-dir ../../web/src/wasm
      # Layer 5
      - run: wasm-pack test --headless --chrome crates/calcarc-wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/

  web:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # wasm は artifact から取得済みなので、ビルドだけ行う。
      - run: pnpm exec vite build
      - run: pnpm check:sw
      - run: pnpm check:version
      # **`web` が重量級を知らないこと**を毎回見る(CLAUDE.md の境界)。
      # 「移した」と書いた時点では守られておらず、6 行が残っていた
      # ——宣言ではなく実行で見張る(2026-08-26)。
      - run: pnpm check:boundary
      # **註が名指しした base-spec の節が実在すること**を毎回見る。
      # 2026-09-04 に「`base-spec §43` は存在しない」という指摘が出て、
      # 実際には存在した(`# 43. Accessibility`)。取り違えたのは grep の
      # 綴りのほうである。**300 件を超える註が base-spec の番号に
      # ぶら下がっている**ので、番号がずれた日に全部が黙って嘘になる
      # (実数は書かない——main が進むたびに動く。検査が毎回印字する)。
      #
      # **この段は 2026-09-05 に一度赤くなった。** この検査と、それが
      # 拾った `2026-09-03-history.md` は別の PR で、**どちらも単独では
      # 緑だった**。合わさって初めて出る誤警報を、ここが見つけた。
      - run: pnpm check:citations

  # **重量級の「道具そのもの」を毎回見る**(2026-08-26、Wave C)。
  # 走らせるのは型検査・lint・ユニットの 3 つだけで、**35 分の本体は載せない**
  # ——本体はタグのときだけ回る。ここが見張るのは、コーパスを叩く道具（ハーネス・
  # 判定・レポート・リリースの証拠）が壊れていないか、である。
  #
  # **これが無かったので、`heavy/` の型検査の赤はタグを打つまで出なかった**
  # ——v0.4.1 の 1 回目は 40 分走ってから重量級の段で落ちている。
  heavy:
    name: Heavy tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: wasm
    defaults:
      run:
        working-directory: heavy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - run: pnpm install --frozen-lockfile
      # **型検査より先に wasm が要る。** `heavy` の型検査は `web/src/calc` を
      # 通って `web/src/wasm/` の型宣言に届く。ここでは `wasm` ジョブが作った
      # ものを artifact から取る(`web`/`e2e` と同じ形)。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      # Layer 5
      # **`--project` を外さない。** 外すと `webkit` の project もこのジョブで
      # 回る——このジョブは chromium しか入れておらず、上の表の実績も
      # Chromium だけの走行から取っている。WebKit は次のジョブが回す。
      - run: pnpm exec playwright test --project mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/

  # **Safari(WebKit)でも同じ E2E を回す**(1.0 の門 1、設計書
  # `docs/superpowers/specs/2026-09-10-one-point-oh-gate-design.md` §1.3)。
  # iPhone では、どのブラウザも中身は WebKit である——**いちばん多い利用者の
  # 環境を、それまで CI は 1 度も通っていなかった。** 中身は `End-to-end` と同じで、
  # 違うのは入れるブラウザ・回す project・報告書の添付名の 3 つだけである。
  #
  # **`End-to-end` の中に足さず、別のジョブにした。** 上の時間制限の表は
  # ジョブごとの実測なので、1 つのジョブで 2 つのブラウザを回すと
  # `End-to-end` の実績が意味を失う。
  #
  # **最初の走行で落ちたものは、手を付ける前に分類する**——(A) 本物の Safari の差 /
  # (B) テストの書き方の癖 / (C) 環境 / (D) 分からない(無理に振り分けない)。
  # **再試行で緑にしない**(`retries` を上げる・待ち時間を伸ばすだけで通すのは、
  # 落ちた理由を消すだけで直していない)。**理由の書かれていない `test.skip` /
  # `test.fixme` を置かない。**
  #
  # **`ubuntu-latest` で `--with-deps webkit` が通るかは(未確認)である。**
  # 2026-09-10 の作業機では、共有ライブラリが 2 つ足りずに WebKit が起動しな
  # かった(設計書 §1.2)。**このジョブの最初の走行が、はじめての実測になる。**
  #
  # 番人は `tools/tests/webkit-gate.test.ts`(このジョブの形・`--project` の
  # 名指し・理由の無い skip)と、`release-workflow.test.ts` の時間制限の番人。
  e2e-webkit:
    name: End-to-end (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps webkit
      # Layer 5
      - run: pnpm exec playwright test --project webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          # **`End-to-end` の添付名と分ける。** 同じ走行で両方が落ちたとき、
          # 名前が同じだと 2 つの報告書を取り違えるか、2 つ目が上がらない
          # (`upload-artifact` は v4 から同名の上書きを既定で拒む。この版で
          # 同名を上げたときの挙動は実測していない)。
          name: playwright-report-webkit
          path: web/playwright-report/

  # **マニュアルの PDF を、リリースと同じ手順で毎回作る**(1.0 の門 4、設計書
  # `docs/superpowers/specs/2026-09-10-manuals-design.md` §5)。**作るだけで、
  # どこにも付けない**——Release に付けるのは `release.yml` の `Manuals` だけである。
  #
  # **ここに置く理由は、リリースで初めて壊れていると分かるのを避けるため**である。
  # リリースの `Manuals` は本番展開のあとで走り、落ちても本番を止めない(裁定
  # §9 #3)——**普段の CI で先に赤くしておかないと、壊れたことに気づく場所が
  # Release の本文(「マニュアル(PDF)は作れなかった」)になる。**
  #
  # **手順は `pnpm manuals` の 1 行だけ**(マニュアルの写真を撮る
  # `pnpm shots --grep @manual` → PDF を刷る `pnpm manual --shots manual-shots`)。
  # リリースの `Manuals` も同じ 1 行を呼ぶ——**写しているのは呼び出しであって、
  # 手順ではない。** 2 つのジョブの段が同じであることは
  # `tools/tests/release-workflow.test.ts` が見る。
  #
  # **書体の外で描かれた字が 1 つでもあれば赤くなる**(`web/scripts/manual/build.mjs`)。
  # 手元では端末の書体が黙って代わりに描くので、**runner に日本語や記号の書体が
  # 在るかどうかに結果を預けない**ためである(設計書 §4)。
  #
  # **失敗しても何も上げない。** 何が落ちたかはログが言う——書体の外で描かれた字は
  # `build.mjs` が要素と候補の字を印字し、撮影の失敗は Playwright が印字する。
  # このジョブが作る物(写真と PDF)は、失敗したときには揃っていない。
  #
  # `playwright test` は `pnpm shots` の中で走り、この字面には出ない——`--project` を
  # 名指さないのは、撮影の設定が project を持たず Chromium だけで撮るからである
  # (`tools/tests/webkit-gate.test.ts` が固定する)。
  manuals:
    name: Manuals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm manuals

  reference:
    name: Python reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # uv 本体も固定する。指定しないと action が最新を入れ、実行ごとに
          # 変わりうる(依存解決は uv.lock が守るが、uv 自身の挙動は守らない)。
          version: "0.12.3"
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: reference
      - run: uv run ruff check .
        working-directory: reference
      - run: uv run ruff format --check .
        working-directory: reference
      # **注釈を書いたなら、それを読む道具を回す。** `ruff` は lint であって
      # 型検査ではない——2026-08-28 まで、`src` の 99% に付いた注釈を
      # 誰も検査していなかった。範囲(`*_ref.py` だけ)と、外した理由は
      # `reference/pyproject.toml` の `[tool.mypy]` が持つ。
      - run: uv run mypy
        working-directory: reference
      - run: uv run pytest
        working-directory: reference
      - run: uv run python scripts/generate.py
        working-directory: reference
      - name: The committed golden files must match a fresh generation
        run: |
          git add --intent-to-add testdata/
          git diff --exit-code testdata/
