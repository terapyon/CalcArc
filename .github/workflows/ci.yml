name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Layer 1-4: unit / engine table / proptest / golden
      - run: cargo test --workspace

  wasm:
    name: WASM boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-wasm-pack
      - name: Use the runner's ChromeDriver
        # wasm-pack は既定で自前の ChromeDriver を取りに行くが、それが
        # ランナーの Chrome とバージョン不一致になると起動に失敗する。
        # Task 14 の実装中に実際にこれが起きた（Chrome 135 に対して
        # ChromeDriver 151 が降ってきた）。ランナー同梱の対になっている
        # ものを使わせる。
        run: echo "CHROMEDRIVER=$(which chromedriver)" >> "$GITHUB_ENV"
      - run: wasm-pack build crates/calcarc-wasm --target web --out-dir ../../web/src/wasm
      # Layer 5
      - run: wasm-pack test --headless --chrome crates/calcarc-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/

  web:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # wasm は artifact から取得済みなので、ビルドだけ行う。
      - run: pnpm exec vite build
      - run: pnpm check:sw

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      # Layer 6
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/

  reference:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: reference
      - run: uv run ruff check .
        working-directory: reference
      - run: uv run ruff format --check .
        working-directory: reference
      - run: uv run pytest
        working-directory: reference
      - run: uv run python scripts/generate.py
        working-directory: reference
      - name: The committed golden files must match a fresh generation
        run: |
          git add --intent-to-add testdata/
          git diff --exit-code testdata/
