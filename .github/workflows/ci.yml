name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable ブランチ 2026-08-13 時点
        with:
          # SHA 固定により ref からのツールチェーン選択が効かないため明示する。
          # stable 追従の方針は CONTRIBUTING の MSRV 節のとおり。
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Layer 1-4: unit / engine table / proptest / golden
      - run: cargo test --workspace

  wasm:
    name: WASM boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-wasm-pack
      - name: Use the runner's ChromeDriver
        # wasm-pack は既定で自前の ChromeDriver を取りに行くが、それが
        # ランナーの Chrome とバージョン不一致になると起動に失敗する。
        # Task 14 の実装中に実際にこれが起きた（Chrome 135 に対して
        # ChromeDriver 151 が降ってきた）。ランナー同梱の対になっている
        # ものを使わせる。
        run: echo "CHROMEDRIVER=$(which chromedriver)" >> "$GITHUB_ENV"
      - run: wasm-pack build crates/calcarc-wasm --target web --out-dir ../../web/src/wasm
      # Layer 5
      - run: wasm-pack test --headless --chrome crates/calcarc-wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-pkg
          path: web/src/wasm/

  web:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # wasm は artifact から取得済みなので、ビルドだけ行う。
      - run: pnpm exec vite build
      - run: pnpm check:sw
      - run: pnpm check:version

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      # **日本語のフォントを入れる。** runner には CJK が無く、入れないと盤面の文字が
      # フォールバックで描かれ、字幅と行高が実機と変わる。**この画面は誰も見ない**
      # ——にもかかわらず 360px の横溢れ検査（nav.spec.ts / viewport-budget.spec.ts）と
      # 面の寸法検査（llm.spec.ts）はその画面を測って落ちる。
      # 実測: CJK を落とした fontconfig で手元を CI 相当に絞ると、同じ 3 本が赤くなる。
      # **検査は 1px も緩めない。測る環境のほうを実機に揃える。**
      - name: Install Japanese fonts (the layout checks measure real glyphs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # Layer 5
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/

  reference:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # uv 本体も固定する。指定しないと action が最新を入れ、実行ごとに
          # 変わりうる(依存解決は uv.lock が守るが、uv 自身の挙動は守らない)。
          version: "0.12.3"
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: reference
      - run: uv run ruff check .
        working-directory: reference
      - run: uv run ruff format --check .
        working-directory: reference
      - run: uv run pytest
        working-directory: reference
      - run: uv run python scripts/generate.py
        working-directory: reference
      - name: The committed golden files must match a fresh generation
        run: |
          git add --intent-to-add testdata/
          git diff --exit-code testdata/
