name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # リリース(release.yml)から呼ばれる。**ジョブの中身は 1 行も変えない**
  # ——「リリース前に通した検査」と「毎回の CI」が別物にならないよう、
  # 定義はこの 1 ファイルだけに置き、呼ぶ側は呼ぶだけにする(設計書 §3)。
  workflow_call:

concurrency:
  # **接頭辞 `ci-` を外さない。** 呼ばれた側の `github.workflow` には
  # **呼び出し元の名前**が入るので、接頭辞が無いと群が呼び出し元と重なり、
  # `cancel-in-progress: true` が**呼び出し元の走行を打ち切る**(設計書 §3.2)。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable ブランチ 2026-08-13 時点
        with:
          # SHA 固定により ref からのツールチェーン選択が効かないため明示する。
          # stable 追従の方針は CONTRIBUTING の MSRV 節のとおり。
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Layer 1-4: unit / engine table / proptest / golden
      - run: cargo test --workspace

  wasm:
    name: WASM boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-wasm-pack
      - name: Use the runner's ChromeDriver
        # wasm-pack は既定で自前の ChromeDriver を取りに行くが、それが
        # ランナーの Chrome とバージョン不一致になると起動に失敗する。
        # Task 14 の実装中に実際にこれが起きた（Chrome 135 に対して
        # ChromeDriver 151 が降ってきた）。ランナー同梱の対になっている
        # ものを使わせる。
        run: echo "CHROMEDRIVER=$(which chromedriver)" >> "$GITHUB_ENV"
      - run: wasm-pack build crates/calcarc-wasm --target web --out-dir ../../web/src/wasm
      # Layer 5
      - run: wasm-pack test --headless --chrome crates/calcarc-wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-pkg
          path: web/src/wasm/

  web:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # wasm は artifact から取得済みなので、ビルドだけ行う。
      - run: pnpm exec vite build
      - run: pnpm check:sw
      - run: pnpm check:version
      # **`web` が重量級を知らないこと**を毎回見る(CLAUDE.md の境界)。
      # 「移した」と書いた時点では守られておらず、6 行が残っていた
      # ——宣言ではなく実行で見張る(2026-08-26)。
      - run: pnpm check:boundary

  # **重量級の「道具そのもの」を毎回見る**(2026-08-26、Wave C)。
  # 走らせるのは型検査・lint・ユニットの 3 つだけで、**35 分の本体は載せない**
  # ——本体はタグのときだけ回る。ここが見張るのは、コーパスを叩く道具（ハーネス・
  # 判定・レポート・リリースの証拠）が壊れていないか、である。
  #
  # **これが無かったので、`heavy/` の型検査の赤はタグを打つまで出なかった**
  # ——v0.4.1 の 1 回目は 40 分走ってから重量級の段で落ちている。
  heavy:
    name: Heavy tooling
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: heavy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-web
      - run: pnpm install --frozen-lockfile
      # **型検査より先に wasm が要る。** `heavy` の型検査は `web/src/calc` を
      # 通って `web/src/wasm/` の型宣言に届く。ここでは `wasm` ジョブが作った
      # ものを artifact から取る(`web`/`e2e` と同じ形)。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: web/src/wasm/
      - run: pnpm exec playwright install --with-deps chromium
      # Layer 5
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/

  reference:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # uv 本体も固定する。指定しないと action が最新を入れ、実行ごとに
          # 変わりうる(依存解決は uv.lock が守るが、uv 自身の挙動は守らない)。
          version: "0.12.3"
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: reference
      - run: uv run ruff check .
        working-directory: reference
      - run: uv run ruff format --check .
        working-directory: reference
      - run: uv run pytest
        working-directory: reference
      - run: uv run python scripts/generate.py
        working-directory: reference
      - name: The committed golden files must match a fresh generation
        run: |
          git add --intent-to-add testdata/
          git diff --exit-code testdata/
