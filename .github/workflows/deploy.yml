name: Deploy

# **本番へ出す扉はタグだけである**(ユーザ裁定 2026-08-25、設計書 §2)。
#  - `release.yml` から呼ばれる——版数・CI・重量級を通した後の通常経路
#  - 手動(workflow_dispatch)——**検査を迂回する緊急経路**。古いタグの ref を
#    選んで配り直すためにある(設計書 §5)。使ったら Release に書き足すこと。
#
# **main への push では走らない。** 「main の先頭 = 配信物」は
# 「最新の `v*` タグ = 配信物」に変わった(`docs/deploy.md`)。
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # 接頭辞 `deploy-` を外さない(理由は ci.yml と同じ。設計書 §3.2)。
  group: deploy-${{ github.workflow }}-deploy
  # デプロイは途中中断より直列完走(設計書 §1)。
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Guard — deploy runs only from a v* tag
        # 版数ゲートはタグ名と 5 箇所の版数の一致を見る。ここで見るのは
        # **そもそもタグから走っているか**だけである——ブランチの先頭を
        # 配ると、Release に添える証拠がどのリリースのものか言えなくなる。
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "deploy は v* タグからのみ。戻すときは revert を main に積んでパッチ版のタグを打つ(docs/deploy.md)" >&2
          exit 1
      - name: Say so when the checks were bypassed
        # 緊急経路で配ったことを、走行の一番上に残す。**黙って迂回しない。**
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## 検査を迂回して配った"
            echo ""
            echo "この走行は \`workflow_dispatch\` の緊急経路である。CI と重量級は**この走行では**"
            echo "走っていない。配った ref は \`${GITHUB_REF_NAME}\`。"
            echo ""
            echo "**Release に何を配ったかを書き足すこと**(docs/deploy.md)。"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-wasm-pack
      - run: wasm-pack build crates/calcarc-wasm --target web --out-dir ../../web/src/wasm
      - uses: ./.github/actions/setup-web
      - run: pnpm exec vite build
        working-directory: web
      # 刻印はビルドの後に書く。public/ に置くと precache に入り、
      # 「いまサーバが何を配っているか」にキャッシュが答えるファイルに
      # なってしまう(設計書 §4)。
      - name: Stamp the build
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > web/dist/build-info.json
      # CI も check:sw を回すが、あれは別のビルドに対してである。
      # 検査した物を配るには、配る物を検査するしかない(設計書 §2)。
      - run: pnpm check:sw
        working-directory: web
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        # バージョンを指定しないと実行ごとに入るものが変わる(wasm-pack
        # v0.9 事件と同じ穴)。上げるときは意図して上げる。
        # wrangler 本体は wranglerVersion で明示固定する(v3.14.1 の既定も
        # 3.90.0 だが、action の既定への暗黙依存を残さない。v4 系は既定が
        # レンジ"4"に変わるため、この明示が将来の穴も塞ぐ)。
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          # Direct Upload は --branch が本番/プレビューを決める。
          command: pages deploy web/dist --project-name=calcarc --branch=main
      # 刻印一致 = 新デプロイの配信が証明済み。この後のヘッダ検査は必ず新しいアセットに当たり、伝播遅延の赤がヘッダの診断に化けない。
      # 逆順だと docs のみのコミットで 3 脚とも旧デプロイに対して緑になりうる。
      - name: Smoke — the latest deploy is being served
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # 伝播遅延に備えて 10 秒間隔で最大 12 回(設計書 §3)。
          for i in $(seq 1 12); do
            served="$(curl -fsS "$base/build-info.json" | head -c 200)" || served=""
            case "$served" in
              *"$GITHUB_SHA"*)
                echo "serving $GITHUB_SHA"
                exit 0 ;;
            esac
            echo "attempt $i: not yet ($served)"
            sleep 10
          done
          echo "deploy did not converge to $GITHUB_SHA" >&2
          exit 1
      - name: Smoke — _headers are respected
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # 初回実行の実測(run 31646329769): _headers の規則は内容の伝播より
          # 遅れて効き始める。刻印(内容)が一致した直後でもヘッダはまだ既定の
          # まま、という 10 秒台のレースが実在した。刻印照合と同じリトライで
          # 吸収する——リトライ後も赤なら、それが本物の「_headers 不尊重」。
          asset="$(ls web/dist/assets | head -1)"
          [ -n "$asset" ]
          for i in $(seq 1 12); do
            # ヘッダ名の大文字小文字は不定なので -i。
            if curl -fsSI "$base/sw.js" | grep -qi "cache-control:.*no-cache" \
              && curl -fsSI "$base/manifest.webmanifest" | grep -qi "cache-control:.*no-cache" \
              && curl -fsSI "$base/assets/$asset" | grep -qi "cache-control:.*immutable"; then
              echo "headers OK (attempt $i)"
              exit 0
            fi
            echo "attempt $i: headers not yet as declared"
            sleep 10
          done
          echo "_headers is not being respected after retries" >&2
          exit 1
      - name: Smoke — the served HTML is this build
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # id="root" だけの検査は壊れたバンドルでも緑になる。この版の
          # index-*.js を指す HTML が配られているかまで見る(設計書 §7-2)。
          # ヘッダ検査と同じ理由でリトライを持つ(ファイル単位の伝播は
          # 非アトミック——刻印の一致は他ファイルの到達を含意しない)。
          bundle="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' web/dist/index.html | head -1)"
          [ -n "$bundle" ]
          for i in $(seq 1 12); do
            if curl -fsS "$base/" | grep -qF "$bundle"; then
              echo "served HTML references $bundle (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTML does not reference this build yet"
            sleep 10
          done
          echo "served HTML never referenced $bundle" >&2
          exit 1

      # 配った物そのものを Release に添えるため、走行に残す(設計書 §4)。
      # **スモーク 3 本の後**に置く——「配った物」と呼べるのは、それが実際に
      # 配信されていることを確かめた後だけである。`build-info.json`(刻印)を
      # 含む `web/dist/` をそのまま上げる。
      - name: Keep what was deployed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployed-dist
          path: web/dist/
          retention-days: 90
