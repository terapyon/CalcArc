name: Deploy

# **本番へ出す扉はタグだけである**(ユーザ裁定 2026-08-25、設計書 §2)。
#  - `release.yml` から呼ばれる——版数・CI・重量級を通した後の通常経路
#  - 手動(workflow_dispatch)——**検査を迂回する緊急経路**。古いタグの ref を
#    選んで配り直すためにある(設計書 §5)。使ったら Release に書き足すこと。
#
# **main への push では走らない。** 「main の先頭 = 配信物」は
# 「最新の `v*` タグ = 配信物」に変わった(`docs/deploy.md`)。
on:
  workflow_call:
    inputs:
      called_from_release:
        # **呼ばれたことを、呼ばれた側が知る手段が要る。** 呼ばれた側の
        # `github.event_name` は**呼び出し元のもの**なので、`release.yml` を
        # 手動起動すると `workflow_dispatch` になり、**検査を通した配信に
        # 「迂回した」と刻んでしまう**(B-9)。
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  # **定数にする。** `github.workflow` を混ぜると、呼ばれた側では呼び出し元の
  # 名前が入るので、`Release` 経由の配信と手動の緊急配信が**別の群**になり、
  # **同時に走れてしまう**(B-7)。本番へ配るのは常に 1 本だけにする。
  group: deploy-production
  # デプロイは途中中断より直列完走(設計書 §1)。
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # **途中で殺されると何が起きるかを先に調べた**(2026-09-05)。下の steps は
    # 3 つの区間に分かれ、**危ないのは ③ だけ**である。
    #
    #   ① `wrangler` より前(checkout・wasm-pack・vite build・刻印・check:sw)
    #      —— 全部この runner の中の話で、**本番は 1 バイトも変わらない**。
    #      殺して失うのはビルドだけ。
    #   ② `wrangler pages deploy` の最中 —— **未確認**。中断した Direct Upload
    #      が live なデプロイになりうるかは Cloudflare 側の振る舞いで、
    #      ここからは試せない。**確かめていないので、確かめた顔で書かない。**
    #   ③ `wrangler` の後(スモーク 5 本と `deployed-dist` の保存)
    #      —— **本番は既に新しいビルドを配っている。** 失うのは「配った物が
    #      本当に配信されているか」の検査 5 本と、Release に添える証拠
    #      (`upload-artifact` に `if: always()` は無い)。**これがいちばん悪い
    #      終わり方**である——出てはいるが、出たことを誰も確かめておらず、
    #      証拠も残っていない。
    #
    # **だから観測最大では決めない。** 実績は 25 本(単独 20・Release 経由 5)で
    # **最大 87 秒**だが、**このジョブは 8 分の再試行予算を内側に持つ**
    # ——下のスモークのうち**再試行を持つ 4 本**がそれぞれ 12 回 × 10 秒待つので、
    # **伝播が遅い日には何も壊れていなくても 9 分半**かかる(87 秒 + 8 分。
    # 「無い PDF が 404」の 1 本だけは待たない——**無いものは伝播しない**)。
    # 観測最大の 2 倍(→ 下限の 10 分)だと、**その日に ③ で殺す。**
    #
    # `ci.yml` の規則を**再試行予算込みの上限 9.5 分**に当てると、2 倍して
    # 5 分刻みに上げて **20 分**である。**0.9.3 でマニュアルのスモークを 2 本
    # 足すまでは、予算は 7.5 分・規則は 15 分で、そこから 1 段(5 分)緩めて
    # 20 分にしていた**——緩めた理由は失敗の形の非対称性だった(他のジョブを
    # 殺すと検査が 1 つ落ちるだけだが、**このジョブを ③ で殺すと本番が
    # 「出たまま未検査」になる**)。**いまは規則がそのまま 20 分を出すので、
    # 値は同じでも「規則より緩い」ではなくなった。**
    # **これ以上スモークを足すなら、この段の値も上げる**——再試行予算は
    # 足した本数ぶん伸び、**上限に当たる日は本番が「出たまま未検査」になる。**
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Guard — deploy runs only from a v* tag
        # 版数ゲートはタグ名と 6 箇所の版数の一致を見る。ここで見るのは
        # **そもそもタグから走っているか**だけである——ブランチの先頭を
        # 配ると、Release に添える証拠がどのリリースのものか言えなくなる。
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "deploy は v* タグからのみ。戻すときは revert を main に積んでパッチ版のタグを打つ(docs/deploy.md)" >&2
          exit 1
      - name: Say so when the checks were bypassed
        # 緊急経路で配ったことを、走行の一番上に残す。**黙って迂回しない。**
        # **`release.yml` から呼ばれたときは出さない**——あちらは版数・CI・
        # 重量級を通してからここへ来るので、迂回していない(B-9)。
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.called_from_release }}
        run: |
          {
            echo "## 検査を迂回して配った"
            echo ""
            echo "この走行は \`workflow_dispatch\` の緊急経路である。CI と重量級は**この走行では**"
            echo "走っていない。配った ref は \`${GITHUB_REF_NAME}\`。"
            echo ""
            echo "**Release に何を配ったかを書き足すこと**(docs/deploy.md)。"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm-pack
      - run: wasm-pack build crates/calcarc-wasm --target web --out-dir ../../web/src/wasm
      - uses: ./.github/actions/setup-web
      - run: pnpm exec vite build
        working-directory: web
      # **マニュアルの PDF を `dist` に入れてから配る**(0.9.3 設計書 §2.3、
      # 利用者の裁定 2026-09-17「PDF が落ちたら本番も出さない」)。
      #
      # - **`vite build` の後**に置く——あれは `dist` を作り直すので、先に
      #   入れると消える
      # - **precache には入らない**(`sw.js` はビルド時に作られ、この後に
      #   足したファイルを知らない)。**PDF は数百 KB あり、入れる理由も無い**
      # - **リリースの走行だけ**である。**緊急の `workflow_dispatch` には
      #   `manuals` の artifact が無い**ので、`called_from_release` で切る
      #   ——**緊急で配った版は PDF を持たず、リンク集の PDF は 404 になる**
      #   (`functions/manual/[[path]].js`)。**迂回の中身が 1 つ増えた**ことは
      #   `docs/deploy.md` のロールバックの節に書いた
      # **同じ走行の artifact である**——呼ばれたワークフローのジョブも、
      # 呼び出し元の走行に属する（`release.yml` の `evidence` が
      # `heavy-report` と `deployed-dist` を同じ形で取っている）。
      # **ただし「呼ばれた側から取る」形は、この 1 段が初めてである**
      # ——**実走で確かめていない。** 取れなければこの段が赤くなり、
      # **配る段はこの後ろなので本番へは出ない**（失敗の向きは安全側）。
      - name: Put the manuals into what we deploy
        if: ${{ inputs.called_from_release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manuals
          path: web/dist/manual/
      # 刻印はビルドの後に書く。public/ に置くと precache に入り、
      # 「いまサーバが何を配っているか」にキャッシュが答えるファイルに
      # なってしまう(設計書 §4)。
      - name: Stamp the build
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > web/dist/build-info.json
      # CI も check:sw を回すが、あれは別のビルドに対してである。
      # 検査した物を配るには、配る物を検査するしかない(設計書 §2)。
      - run: pnpm check:sw
        working-directory: web
      # **これは node20 のまま残す**(2026-09-05、Node 24 への移行のとき)。
      # `v0.8.0` の走行の注意書きは**この action も挙げていた**ので、
      # 「言われていないから」は理由にならない。**上げない理由は 1 つだけ
      # である**——**この 1 か所は本番配信でしか走らない。**
      # `deploy.yml` は `workflow_call`(リリース)か、緊急の
      # `workflow_dispatch` でしか動かず、**普段の CI では 1 度も通らない。**
      # v3 → v4 はメジャー跳びで、**確かめる場所が無いまま上げると、
      # 失敗するのは本番配信の最中である。** 上げるなら別の枝・別の裁定で。
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        # バージョンを指定しないと実行ごとに入るものが変わる(wasm-pack
        # v0.9 事件と同じ穴)。上げるときは意図して上げる。
        # wrangler 本体は wranglerVersion で明示固定する(v3.14.1 の既定も
        # 3.90.0 だが、action の既定への暗黙依存を残さない。v4 系は既定が
        # レンジ"4"に変わるため、この明示が将来の穴も塞ぐ)。
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          # Direct Upload は --branch が本番/プレビューを決める。
          command: pages deploy web/dist --project-name=calcarc --branch=main
      # 刻印一致 = 新デプロイの配信が証明済み。この後のヘッダ検査は必ず新しいアセットに当たり、伝播遅延の赤がヘッダの診断に化けない。
      # 逆順だと docs のみのコミットで 3 脚とも旧デプロイに対して緑になりうる。
      - name: Smoke — the latest deploy is being served
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # 伝播遅延に備えて 10 秒間隔で最大 12 回(設計書 §3)。
          for i in $(seq 1 12); do
            served="$(curl -fsS "$base/build-info.json" | head -c 200)" || served=""
            case "$served" in
              *"$GITHUB_SHA"*)
                echo "serving $GITHUB_SHA"
                exit 0 ;;
            esac
            echo "attempt $i: not yet ($served)"
            sleep 10
          done
          echo "deploy did not converge to $GITHUB_SHA" >&2
          exit 1
      - name: Smoke — _headers are respected
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # 初回実行の実測(run 31646329769): _headers の規則は内容の伝播より
          # 遅れて効き始める。刻印(内容)が一致した直後でもヘッダはまだ既定の
          # まま、という 10 秒台のレースが実在した。刻印照合と同じリトライで
          # 吸収する——リトライ後も赤なら、それが本物の「_headers 不尊重」。
          asset="$(ls web/dist/assets | head -1)"
          [ -n "$asset" ]
          for i in $(seq 1 12); do
            # ヘッダ名の大文字小文字は不定なので -i。
            if curl -fsSI "$base/sw.js" | grep -qi "cache-control:.*no-cache" \
              && curl -fsSI "$base/manifest.webmanifest" | grep -qi "cache-control:.*no-cache" \
              && curl -fsSI "$base/assets/$asset" | grep -qi "cache-control:.*immutable"; then
              echo "headers OK (attempt $i)"
              exit 0
            fi
            echo "attempt $i: headers not yet as declared"
            sleep 10
          done
          echo "_headers is not being respected after retries" >&2
          exit 1
      - name: Smoke — the served HTML is this build
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # id="root" だけの検査は壊れたバンドルでも緑になる。この版の
          # index-*.js を指す HTML が配られているかまで見る(設計書 §7-2)。
          # ヘッダ検査と同じ理由でリトライを持つ(ファイル単位の伝播は
          # 非アトミック——刻印の一致は他ファイルの到達を含意しない)。
          bundle="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' web/dist/index.html | head -1)"
          [ -n "$bundle" ]
          for i in $(seq 1 12); do
            if curl -fsS "$base/" | grep -qF "$bundle"; then
              echo "served HTML references $bundle (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTML does not reference this build yet"
            sleep 10
          done
          echo "served HTML never referenced $bundle" >&2
          exit 1
      # **マニュアルの経路を、配った先で 1 度だけ確かめる**(0.9.3 設計書 §2.1.2)。
      # **単体テストは `env.ASSETS` の作り物に対してである**——Pages が本当に
      # `functions/manual/[[path]].js` を拾っているか、`_redirects` の
      # `/* /index.html 200` に先を越されていないかは、**ここでしか分からない。**
      - name: Smoke — a manual PDF that does not exist is 404, not the app shell
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # **`-f` を付けない。** 404 で curl が落ちると、番号を読む前に段が死ぬ。
          miss="$base/manual/calcarc-no-such-manual.pdf"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$miss")"
          # **緊急経路でも同じ答えである**(PDF が 1 冊も無い版でも、無いものは 404)。
          if [ "$code" != "404" ]; then
            echo "存在しない PDF が $code を返した(Function が効いていない)" >&2
            exit 1
          fi
          echo "missing PDF is 404"
      - name: Smoke — the manuals we deployed are being served
        # **リリースの走行だけ。** 緊急経路の版は PDF を持たない
        # (`docs/deploy.md` のロールバック)。
        if: ${{ inputs.called_from_release }}
        run: |
          set -eu
          base="https://calc.terapyon.net"
          # **配った物から名前を取る**——版数を綴ると、上げ忘れた日に緑になる。
          pdf="$(ls web/dist/manual | head -1)"
          [ -n "$pdf" ]
          # 他のスモークと同じリトライ(ファイル単位の伝播は非アトミック)。
          # **`Content-Disposition: attachment` も見る**(0.9.4)。**0.9.4 の狙い
          # (ホーム画面のアプリが PDF に乗っ取られるのを止める)は外れた**
          # ——本番で付いていても iPhone では戻れなかった(2026-09-18 の実測)。
          # **0.9.6 からリンク集の PDF はまたサイトの中を指す**(利用者の裁定
          # 2026-09-23。0.9.5 のあいだだけ GitHub の Release を指していた)
          # ——**この経路はアプリが使っている**(`functions/manual/[[path]].js` の註)。
          # **付けているのは `functions/manual/` の Function だけ**
          # である——**つまりこの検査は「Function が本番で拾われている」ことの
          # 証拠でもある**(実在の PDF は Function が無くても静的ファイルとして
          # 配られるので、**type だけでは拾われたかどうか分からない**)。
          #
          # **★ 両方を再試行の内側に置く**(1e の指摘 2026-09-18)。
          # **この段の前提は「ファイル単位の伝播は非アトミック」**である
          # ——**古い配備の縁が PDF を返す瞬間は Function も古く、
          # attachment が無いのは「まだ伝播していない」でもありうる**。
          # **即座に落とすと、伝播待ちを「Function が拾われていない」と
          # 言い切ってしまう**(今日 Mac の Chrome で出た 404 と同じ筋)。
          last="(まだ何も見ていない)"
          for i in $(seq 1 12); do
            head="$(curl -sSI "$base/manual/$pdf")"
            type="$(printf '%s' "$head" | grep -i '^content-type:' | head -1)"
            case "$type" in
              *application/pdf*)
                if printf '%s' "$head" | grep -qi '^content-disposition:.*attachment'; then
                  echo "serving $pdf (pdf + attachment)"
                  exit 0
                fi
                last="pdf は返るが attachment が無い(Function が古いか、拾われていない)" ;;
              *)
                last="content-type が ${type:-(無し)}(PDF がまだ届いていない)" ;;
            esac
            echo "attempt $i: $last"
            sleep 10
          done
          # **最後に見たものを理由として出す。** 「PDF が来ない」と
          # 「PDF は来るが attachment が無い」は**直す先が違う**——前者は配り方、
          # 後者は `functions/` が拾われているかである。
          echo "12 回の再試行のあとも緑にならなかった: $last" >&2
          exit 1

      # 配った物そのものを Release に添えるため、走行に残す(設計書 §4)。
      # **スモーク 5 本の後**に置く——「配った物」と呼べるのは、それが実際に
      # 配信されていることを確かめた後だけである。`build-info.json`(刻印)を
      # 含む `web/dist/` をそのまま上げる。
      - name: Keep what was deployed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-dist
          path: web/dist/
          retention-days: 90
