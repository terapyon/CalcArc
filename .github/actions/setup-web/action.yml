name: Setup web toolchain
description: >
  pnpm + node + 依存インストール。バージョンと cache 設定はここに一本化。
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        # package.json はリポジトリ直下ではなく web/ にある。
        package_json_file: web/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # **系列ではなくパッチ版まで固定する。** `22` と書くと「そのときの
        # 最新の 22.x」が入るので、走行ごとに違う node で回りうる。
        # **`web/package.json` と `heavy/package.json` の `engines` と同じ版**
        # にすること——片方だけ動かすと `pnpm install` がここで落ちる。
        node-version: 24.19.0
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
