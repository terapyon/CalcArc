name: Setup web toolchain
description: >
  pnpm + node + 依存インストール。バージョンと cache 設定はここに一本化。
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        # package.json はリポジトリ直下ではなく web/ にある。
        package_json_file: web/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        # **系列ではなくパッチ版まで固定する。** `22` と書くと「そのときの
        # 最新の 22.x」が入るので、走行ごとに違う node で回りうる。
        # **`web/package.json` と `heavy/package.json` の `engines` と同じ版**
        # にすること——片方だけ動かすと `pnpm install` がここで落ちる。
        node-version: 22.23.2
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
